name: single-principal implementation

on:
  push:
    branches:
      - single-principal-kernel
    paths:
      - .github/workflows/single-principal-implementation.yml

permissions:
  contents: write

jobs:
  implement-and-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: single-principal-kernel
          fetch-depth: 0

      - name: Apply credential implementation
        shell: bash
        run: |
          set -eu
          python3 .github/single-principal-apply.py credentials
          git diff --check
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add sys/kern/kern_auth.c sys/kern/kern_proc.c sys/kern/kern_prot.c sys/kern/kern_exec.c
          git commit -m 'kern: collapse process credentials to one compatibility identity'

      - name: Apply FFS and genfs implementation
        shell: bash
        run: |
          set -eu
          python3 .github/single-principal-apply.py vfs
          git diff --check
          git add sys/miscfs/genfs/genfs_vnops.c sys/ufs/ufs/ufs_vnops.c sys/ufs/ffs/ffs_vfsops.c
          git commit -m 'vfs: use one mode-bit class without UID distinctions'

      - name: Push implementation commits
        shell: bash
        run: |
          set -eu
          git status --short --branch
          git push origin HEAD:single-principal-kernel

      - name: Compile SINGLEPRINCIPAL
        shell: bash
        run: |
          set +e
          mkdir -p ci-evidence "$HOME/obj/netbsd-singleprincipal"
          echo './build.sh -U -u -j4 -m amd64 -O "$HOME/obj/netbsd-singleprincipal" tools kernel=SINGLEPRINCIPAL' | tee ci-evidence/implementation-command.txt
          git rev-parse HEAD | tee ci-evidence/implementation-head.txt
          ./build.sh -U -u -j4 -m amd64 -O "$HOME/obj/netbsd-singleprincipal" tools kernel=SINGLEPRINCIPAL 2>&1 | tee ci-evidence/singleprincipal-compile.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" | tee ci-evidence/singleprincipal-compile-status.txt
          exit "$status"

      - name: Upload implementation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: single-principal-implementation-evidence
          path: ci-evidence/
          if-no-files-found: warn
